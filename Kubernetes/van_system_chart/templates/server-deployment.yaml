apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: {{ .Values.server.deployment.replicasCount }}
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready \
                -h postgres-service \
                -U postgres \
                -d fyp_db
              do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done

              echo "PostgreSQL is ready."
      containers:
        - name: server
          image: "{{ .Values.server.deployment.image.repository }}:{{ .Values.server.deployment.image.tag }}"
          resources: {{- toYaml .Values.server.deployment.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.server.deployment.port }}
          envFrom:
            - configMapRef:
                name: {{ .Values.server.deployment.configMap.name }}
