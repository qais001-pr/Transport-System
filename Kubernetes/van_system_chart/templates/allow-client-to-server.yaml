{{- if .Values.networkPolicy.clientToServerIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.clientToServerIngress.name }}

spec:
  podSelector:
    matchLabels:
      app: {{ .Values.networkPolicy.clientToServerIngress.targetPod }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.networkPolicy.clientToServerIngress.sourcePod }}
{{- end }}