postgres:

  database:
    user: postgres
    password: postgres
    name: fyp_db


  job:
    backoffLimit: 3
    activeDeadlineSeconds: 600
    restartPolicy: Never

    image: 
      repository: postgres
      tag: 17-alpine
      pullPolicy: IfNotPresent

    sql:
      configMapName: postgres-init-sql
      fileName: fyp_db.sql


  persistentStorage:
    
    nodeSelector:
      key: node-role
      operator: In
      values: 
       - application
    
    capacity:
      storage: 10Gi
      volumeMode: Filesystem
    
    accessModes:
      - ReadWriteOnce
    pvReclaimPolicy: Retain
    storageClassName: local-storage
    hostpath: /data/postgres


  service:
    
    port: 5432
    targetPort: 5432
    type: ClusterIP


  statefulset:
    
    replicasCount: 1
    
    nodeSelector:
      node-role: application
    
    image:
      repository: postgres
      tag: 17-alpine
      pullPolicy: IfNotPresent
      port: 5432
    
    resources:
    
      requests:
        cpu: 200m
        memory: 256Mi
    
      limits:
        cpu: 500m
        memory: 512Mi
    
    storage:
      name: postgres-storage
      mountPath: /var/lib/postgresql/data
      claimName: postgres-pvc



pgadmin:
  

  autoScaling:
    
    enabled: true

    minreplicas: 1
    maxreplicas: 3
    cpuUtilization: 40
    memoryUtilization: 70

  secret:
    email: admin@example.com
    password: admin123
  
  service:
    port: 5050
    targetPort: 80
    type: ClusterIP
  
  persistentStorage:
    storageClassName: local-storage
    volumeMode: Filesystem
    accessModes:
     - ReadWriteOnce
  
    capacity:
      storage: 2Gi
      pvstorage: 2Gi
  
    reclaimpolicy: Retain
  
    hostPath:
      path: /data/pgadmin
      type: DirectoryOrCreate
  
  deployment:
  
    replicasCount: 1
  
    image:
      repository: dpage/pgadmin4
      tag: latest
      pullPolicy: IfNotPresent
  
    resources:
        requests:
          cpu: "200m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
  
    volume:
      name: pgadmin-storage
      claimName: pgadmin-pvc
      mountPath: /data/pgadmin



