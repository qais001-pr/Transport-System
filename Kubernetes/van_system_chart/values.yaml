client:
  autoScaling:
    
    enabled: true

    minreplicas: 2
    maxreplicas: 6
    cpuUtilization: 40
    memoryUtilization: 60

  service:
    port: 3000
    targetPort: 3000
    type: ClusterIP

  deployment:
    
    replicasCount: 1

    image: 
      repository: qais001/vansystem-webapp
      tag: v4.0.0
      pullPolicy: IfNotPresent

    port: 3000
    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    





ingress:
  enabled: true

  className: nginx

  host: vansystem.local

  api:
    enabled: true
    name: vansystem-ingress

    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"

    path: /api(/|$)(.*)
    pathType: ImplementationSpecific

    service:
      name: server-service
      port: 7860

  client:
    enabled: true
    name: vansystem-client-ingress

    annotations: {}

    path: /
    pathType: Prefix

    service:
      name: client-service
      port: 3000

networkPolicy:
  dns:
    enabled: true
    name: allow-dns
    namespace: kube-system
    labelKey: k8s-app
    podLabel: kube-dns
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  defaultDeny:
    enabled: true
    name: default-deny-all
  clientEgress:
    enabled: true
    name: allow-client-egress
    sourcePod: client
    destinationPod: server
  pgadminEgress:
    enabled: true
    name: allow-pgadmin-egress
    sourcePod: pgadmin
    destinationPod: postgres
  serverEgress:
    enabled: true
    name: allow-server-egress
    sourcePod: server
    destinationPod: postgres
  clientIngressNginx:
    enabled: true
    name: allow-ingress-to-client
    targetPod: client
    namespace: ingress-nginx
    labelKey: app.kubernetes.io/component
    controller: controller
  pgadminIngress:
    enabled: true
    name: allow-ingress-to-pgadmin
    targetPod: pgadmin
    namespace: ingress-nginx
    labelKey: app.kubernetes.io/component
    controller: controller
  clientToServerIngress:
    enabled: true
    name: allow-client-to-server
    targetPod: server
    sourcePod: client
  serverIngress:
    enabled: true
    name: allow-ingress-to-server
    targetPod: server
    namespace: ingress-nginx
    labelKey: app.kubernetes.io/component
    controller: controller
  pgadminToPostgresIngress:
      enabled: true
      name: allow-pgadmin-to-postgres
      targetPod: postgres
      sourcePod: pgadmin
  serverToPostgresIngress:
    enabled: true
    name: allow-server-to-postgres
    targetPod: postgres
    sourcePod: server