{{- if .Values.networkPolicy.serverToPostgresIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.serverToPostgresIngress.name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.networkPolicy.serverToPostgresIngress.targetPod }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.networkPolicy.serverToPostgresIngress.sourcePod }}
{{- end }}