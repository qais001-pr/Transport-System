{{- if .Values.networkPolicy.clientEgress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.clientEgress.name }}

spec:
  podSelector:
    matchLabels:
      app: {{ .Values.networkPolicy.clientEgress.sourcePod }}

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.networkPolicy.clientEgress.destinationPod }}
{{- end }}