apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-job
  namespace: vansystem
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: postgres-init-job

    spec:
      restartPolicy: Never

      containers:
        - name: postgres-init

          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."

              until pg_isready \
                -h postgres-service \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB"
              do
                echo "PostgreSQL is not ready yet..."
                sleep 5
              done

              echo "PostgreSQL is ready."

              echo "Executing SQL script..."

              psql \
                -h postgres-service \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -f /sql/fyp_db.sql

              echo "Database initialization completed."

          volumeMounts:
            - name: postgres-init-script
              mountPath: /sql
              readOnly: true

      volumes:
        - name: postgres-init-script
          configMap:
            name: postgres-init-sql
