name: Backend-Continuous-Integration

permissions:
  contents: read
  security-events: write

on:
  push:
    branches:
      - update
    paths:
      - "backend/**"

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Dependency Vulnerability Scan
        run: npm audit --audit-level=high
        working-directory: ./backend

      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        with:
          path: ./backend
          report-format: sarif
          report-path: gitleaks-report.sarif
          verbose: true
          hard-fail: true

      - name: Build and Push Backend Docker Image
        run: |
          cd backend
          docker build -t qais001/school-transport-system:${{ inputs.sha }} .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:test
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push Docker Image
        run: |
          docker push qais001/school-transport-system:${{ inputs.sha }}

      - name: Update Helm Chart, Values and Push Changes to Git
        run: |
          FULL_TAG="${{ inputs.sha }}"

          cd School-Transport-System-Deployment

          # Docker Hub Image tags update karein
          yq -i ".server.image.tag = \"${FULL_TAG}\"" values.yaml

          # Git Config & Push to Deployment Repo
          git config user.name "Muhammad Qais"
          git config user.email "qaismuhammad742@gmail.com"
          git add .
          git commit -m "chore(helm): release version ${FULL_TAG} [skip ci]" || echo "No changes to commit"
          git push origin main
