name: Make a Version By Using Tag & update a Helm Chart

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: "Enter Git Tag/Version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  release_and_update_helm_chart:
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut Main Repository
        uses: actions/checkout@v4

      - name: CheckOut Deployment Repository
        uses: actions/checkout@v4
        with:
          repository: qais001-pr/School-Transport-System-Deployment
          token: ${{ secrets.HELM_TOKEN }}
          ref: "main"
          path: "School-Transport-System-Deployment"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      # -------------------------------------------------------------
      # 1. DOCKER HUB LOGIN & IMAGE BUILDS
      # -------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Docker Image
        run: |
          cd frontend
          docker build \
          --build-arg VITE_SOCKET_URL="${{ vars.VITE_SOCKET_URL }}" \
          --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" \
          --build-arg VITE_VAPID_PUBLIC_KEY="${{ vars.VITE_VAPID_PUBLIC_KEY }}" \
          -t qais001/school-transport-web:${{ inputs.tag_version }} \
          -f ./Dockerfile.k8s .

      - name: Build and Push Backend Docker Image
        run: cd backend
          docker build -t qais001/school-transport-backend:${{ inputs.tag_version }} .

      # -------------------------------------------------------------
      # 2. UPDATE HELM CHART & VALUES
      # -------------------------------------------------------------
      - name: Update Helm Chart, Values and Push Changes to Git
        run: |
          FULL_TAG="${{ inputs.tag_version }}"
          CLEAN_VERSION=${FULL_TAG#v}

          cd School-Transport-System-Deployment

          # Agar chart sub-folder me ho to navigate karein
          if [ -d "helm" ]; then cd helm; fi

          # Chart version, App version aur Images update karein
          yq -i ".version = \"${CLEAN_VERSION}\"" Chart.yaml
          yq -i ".appVersion = \"${FULL_TAG}\"" Chart.yaml

          # Docker Hub Image paths & Tags
          yq -i ".client.image.repository = ${{}}" values.yaml
          yq -i ".client.image.tag = \"${FULL_TAG}\"" values.yaml
          yq -i ".server.image.repository = ${{}}" values.yaml
          yq -i ".server.image.tag = \"${FULL_TAG}\"" values.yaml

          echo "--- Updated Chart.yaml ---"
          cat Chart.yaml

      #     # Git Config & Push to Deployment Repo
