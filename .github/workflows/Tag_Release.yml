name: Trigger Jenkins

on:
  push:
    branches:
      - update
    tags:
      - 'v*'

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jenkins Pipeline
        run: |
          curl -f -s -S -X POST \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/School%20Transport%20Management%20System/buildWithParameters?TAG_NAME=${GITHUB_REF_NAME}"