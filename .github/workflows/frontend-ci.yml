name: Front Continuous Deployment

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: docker build --build-arg VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }} --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} --build-arg VITE_VAPID_PUBLIC_KEY=${{ vars.VITE_VAPID_PUBLIC_KEY }} -t ${{ secrets.DOCKER_USERNAME }}/school-transport-web:${{ github.ref_name }} -f ./frontend/Dockerfile.k8s ./frontend
      - name: Check Docker Images
        run: docker images
      - name: Push Docker Images
        run: docker push ${{ secrets.DOCKER_USERNAME }}/school-transport-web:${{ github.ref_name }}
